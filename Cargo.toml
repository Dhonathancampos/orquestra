[package]
name = "orquestra"
version = "0.1.0"
edition = "2024"
description = "Orquestrador de terminais para trabalhar com IA"
repository = "https://github.com/Dhonathancampos/orquestra"

[features]
# Janela nativa (WebView2 / WKWebView / WebKitGTK). No Linux precisa de libwebkit2gtk-4.1-dev para compilar.
gui = ["dep:wry", "dep:tao"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
dirs = "7.0.0"
futures-util = "0.3.34"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
rust-embed = { version = "8.14.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
strip-ansi-escapes = "0.2.1"
tao = { version = "0.37.2", optional = true }
tokio = { version = "1.54.1", features = ["full"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.29.3", features = ["v4"] }
vt100 = "0.18.1"
webbrowser = "1.2.7"
wry = { version = "0.57.2", optional = true }
